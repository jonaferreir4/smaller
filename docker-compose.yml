services:
  db:
    image: postgres:15
    container_name: smaller-db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Em produção, o banco fica isolado na rede interna do Docker.
    # Descomente a linha abaixo somente para desenvolvimento local direto na máquina host:
    # ports:
    #   - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 3s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: smaller-redis
    restart: always
    # Em produção, o Redis fica isolado na rede interna do Docker.
    # Descomente a linha abaixo somente para desenvolvimento local direto na máquina host:
    # ports:
    #   - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data

  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smaller-app
    restart: always
    # Porta exposta apenas para acesso direto durante desenvolvimento
    # Em produção, o Traefik roteia internamente para a porta 5000
    # ports:
    #   - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DB_HOST: db
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      DOMAIN_NAME: ${DOMAIN_NAME}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_AUDIENCE: ${JWT_AUDIENCE}
      FREE_PLAN_LINK_LIMIT: ${FREE_PLAN_LINK_LIMIT}

    labels:
      - 'traefik.enable=true'
      # Roteamento para a API (ex: /api/shorten, /api/links)
      - 'traefik.http.routers.smaller-api.rule=Host(`${DOMAIN_NAME}`) && PathPrefix(`/api`)'
      - 'traefik.http.routers.smaller-api.entrypoints=web'
      - 'traefik.http.routers.smaller-api.priority=30'
      # Roteamento para redirecionamento de short codes (ex: /AbCdEfG ou /blackfriday)
      # PathRegexp v3: captura paths com 3 a 30 caracteres alfanuméricos, hífen ou underscore
      - 'traefik.http.routers.smaller-redirect.rule=Host(`${DOMAIN_NAME}`) && PathRegexp(`^/[A-Za-z0-9_-]{3,30}$$`)'
      - 'traefik.http.routers.smaller-redirect.entrypoints=web'
      - 'traefik.http.routers.smaller-redirect.priority=20'
      - 'traefik.http.services.smaller-service.loadbalancer.server.port=5000'

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smaller-frontend
    restart: always
    depends_on:
      - app
    labels:
      - 'traefik.enable=true'
      # Rotas específicas do frontend com prioridade 25 para não colidir com slugs customizados
      - 'traefik.http.routers.smaller-frontend-routes.rule=Host(`${DOMAIN_NAME}`) && (Path(`/`, `/dashboard`, `/profile`, `/termos`, `/privacidade`) || PathPrefix(`/assets/`))'
      - 'traefik.http.routers.smaller-frontend-routes.entrypoints=web'
      - 'traefik.http.routers.smaller-frontend-routes.priority=25'
      # Catch-all: tudo que não é /api nem short code vai para o frontend SPA
      - 'traefik.http.routers.smaller-frontend.rule=Host(`${DOMAIN_NAME}`)'
      - 'traefik.http.routers.smaller-frontend.entrypoints=web'
      - 'traefik.http.routers.smaller-frontend.priority=10'
      - 'traefik.http.services.smaller-frontend.loadbalancer.server.port=80'

  traefik: 
    image: traefik:v3.6
    command: 
      - "--api.dashboard=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"

      - "--entrypoints.web.address=:80"
      # Configuração para produção com HTTPS / Let's Encrypt:
      # - "--entrypoints.websecure.address=:443"
      # - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      # - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      # - "--certificatesresolvers.letsencrypt.acme.tlschallenge=true"
      # - "--certificatesresolvers.letsencrypt.acme.email=${LE_EMAIL}"
      # - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      # - "443:443"  # Descomentar ao habilitar HTTPS
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-certs:/letsencrypt
    # labels:
    #     # Roteamento para o dashboard do Traefik
    #   - "traefik.enable=true"
    #   - "traefik.http.routers.dashboard.rule=Host(`traefik.dominio.com`)"
    #   - "traefik.http.routers.dashboard.service=api@internal"
    #   - "traefik.http.routers.dashboard.entrypoints=websecure"
    #   - "traefik.http.routers.dashboard.tls.certresolver=letsencrypt"
    #   # Autenticação básica para o dashboard
    #   - "traefik.http.middlewares.dashboard-auth.basicauth.users=${TRAEFIK_DASHBOARD_AUTH}"
    #   - "traefik.http.routers.dashboard.middlewares=dashboard-auth" 

volumes:
  postgres_data:
  redis_data:
  traefik-certs: