services:
  db:
    image: postgres:15
    container_name: smaller-db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  app:
    build: .
    container_name: smaller-app
    restart: always
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      
      DOMAIN_NAME: ${DOMAIN_NAME}

    labels:
      - "traefik.enable=true" 
      # Roteamento para a API (ex: /api/shorten, /api/links)
      - "traefik.http.routers.smaller-api.rule=Host(`${DOMAIN_NAME}`) && PathPrefix(`/api`)"
      - "traefik.http.routers.smaller-api.entrypoints=web"
      - "traefik.http.routers.smaller-api.priority=30"

      - "traefik.http.routers.smaller-redirect.rule=Host(`${DOMAIN_NAME}`) && PathPrefix(`/`)"
      - "traefik.http.routers.smaller-redirect.entrypoints=web"
      - "traefik.http.routers.smaller-redirect.priority=20" # Prioridade para evitar conflitos com a rota da API
      - "traefik.http.services.smaller-service.loadbalancer.server.port=5000" 

  frontend:
    build:
      context: ../smaller-front
      dockerfile: Dockerfile
    container_name: smaller-frontend
    restart: always
    depends_on:
      - app
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.smaller-frontend.rule=Host(`${DOMAIN_NAME_FRONT}`)"
      - "traefik.http.routers.smaller-frontend.entrypoints=web"
      - "traefik.http.routers.smaller-frontend.priority=10" 
      - "traefik.http.services.smaller-frontend.loadbalancer.server.port=80"

  traefik: 
    image: traefik:v3.5
    environment:
      - DOCKER_API_VERSION=1.40
    command: 
      - "--api.dashboard=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"

      - "--entrypoints.web.address=:80"
      # - "--entrypoints.websecure.address=:443"

      # - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      # - "--entrypoints.web.http.redirections.entrypoint.scheme=https"

      # - "--certificatesresolvers.letsencrypt.acme.tlschallenge=true"
      # - "--certificatesresolvers.letsencrypt.acme.email=${LE_EMAIL}"
      # - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      # - "443:443"
      # - "8080:8080" # Porta para o dashboard da API
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - traefik-certs:/letsencrypt
    # labels:
    #     # Roteamento para o dashboard do Traefik
    #   - "traefik.enable=true"
    #   - "traefik.http.routers.dashboard.rule=Host(`traefik.dominio.com`)"
    #   - "traefik.http.routers.dashboard.service=api@internal"
    #   - "traefik.http.routers.dashboard.entrypoints=websecure"
    #   - "traefik.http.routers.dashboard.tls.certresolver=letsencrypt"
    #   # Autenticação básica para o dashboard
    #   - "traefik.http.middlewares.dashboard-auth.basicauth.users=${TRAEFIK_DASHBOARD_AUTH}"
    #   - "traefik.http.routers.dashboard.middlewares=dashboard-auth" 

volumes:
  postgres_data:
  traefik-certs: