<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon-v2.svg?v=2" />
    <link rel="shortcut icon" href="/favicon-v2.svg?v=2" />
    <link rel="apple-touch-icon" href="/favicon-v2.svg?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary Meta Tags -->
    <title>Smaller - Encurtador de URLs Rápido e Seguro</title>
    <meta name="title" content="Smaller - Encurtador de URLs Rápido e Seguro" />
    <meta name="description" content="Smaller é um encurtador de URLs simples e eficiente. Encurte links longos, gere QR Codes e acompanhe métricas de cliques em tempo real." />
    <meta name="keywords" content="encurtador de url, link curto, encurtar link, qr code, analytics de url, estatísticas de cliques" />
    <meta name="author" content="Smaller Team" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://smaller.app/" />
    <meta property="og:title" content="Smaller - Encurtador de URLs Rápido e Seguro" />
    <meta property="og:description" content="Encurte seus links longos em segundos com o Smaller. Acompanhe a contagem de cliques e gere QR Codes para compartilhamento." />
    <meta property="og:image" content="/favicon-v2.svg?v=2" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://smaller.app/" />
    <meta property="twitter:title" content="Smaller - Encurtador de URLs Rápido e Seguro" />
    <meta property="twitter:description" content="Encurte seus links longos em segundos com o Smaller. Acompanhe a contagem de cliques e gere QR Codes." />
    <meta property="twitter:image" content="/favicon-v2.svg?v=2" />

    <script>
      (function() {
        try {
          const stored = localStorage.getItem("smaller-theme");
          const theme = stored || "system";
          const isDark = theme === "dark" || (theme === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          const root = document.documentElement;
          if (isDark) {
            root.classList.add("dark");
            root.classList.remove("light");
            root.setAttribute("data-theme", "dark");
            root.style.colorScheme = "dark";
          } else {
            root.classList.remove("dark");
            root.classList.add("light");
            root.setAttribute("data-theme", "light");
            root.style.colorScheme = "light";
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
