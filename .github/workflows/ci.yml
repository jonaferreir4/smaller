name: CI Monorepo Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    name: Backend Build & Test (.NET 8)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: cd backend && dotnet restore

      - name: Build project
        run: cd backend && dotnet build --no-restore -c Release

      - name: Run unit & integration tests
        run: cd backend && dotnet test --no-build -c Release --verbosity normal

  frontend-build:
    name: Frontend Lint & Build (React 19 / Vite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Audit production dependencies
        run: cd frontend && npm audit --omit=dev

      - name: Run ESLint
        run: cd frontend && npm run lint

      - name: Build application
        run: cd frontend && npm run build
